server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "frontend ok\n";
    }

    location = /api/health {
        proxy_pass http://catalog-service:8000;
    }

    location /api/tanks/ {
        proxy_pass http://catalog-service:8000;
    }

    location /api/maps/ {
        proxy_pass http://catalog-service:8000;
    }

    location /api/players/ {
        proxy_pass http://community-service:8000;
    }

    location /api/clans/ {
        proxy_pass http://community-service:8000;
    }

    location /api/achievements/ {
        proxy_pass http://community-service:8000;
    }

    location /api/battles/ {
        proxy_pass http://battle-service:8000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
